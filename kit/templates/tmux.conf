set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc'
set-environment -g LANG C.utf8
set -g history-limit 50000

# Bare PgUp enters copy-mode and scrolls one page up. -e flag exits
# copy-mode automatically when scrolled back to the bottom. Without
# this, PgUp passes through to claude-code, which doesn't scroll
# tmux's history.
# Since Claude Code went fullscreen ("tui": "fullscreen", alternate screen,
# history_size=0) tmux has no scrollback for it, and CC scrolls its own
# transcript on PgUp. So pass PgUp through to alternate-screen apps and
# only enter copy-mode for normal panes. (2026-10-04)
bind-key -n PageUp if-shell -F '#{alternate_on}' 'send-keys PageUp' 'copy-mode -eu'

# Status bar — show hostname
set -g status on
set -g status-style "bg=#313244,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#fab387,bold] ${BOT_NAME} #[default]│ "
set -g status-right "#[fg=#6c7086]%H:%M %Y-%m-%d"
set -g status-left-length 20

# Shift+Enter over SSH+tmux+Ghostty was only sending plain Enter — tmux
# swallowed the Kitty-protocol escape sequence Ghostty emits for it, so
# Claude Code saw a bare Enter and submitted instead of inserting a
# newline.. Negotiation happens at *attach*
# time, so a config reload is not enough — detach and reattach.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# WezTerm on Windows (ssh via Windows OpenSSH/ConPTY) had its XTVERSION reply
# typed into the pane on attach: ">|WezTerm 20240203-110809-5046fc22" landed in
# Claude Code's prompt. tmux queries the outer terminal on attach; ConPTY
# delivers the reply split/late, and tmux 3.5's default escape-time (10ms) gave
# up on the partial sequence and passed the rest through as keystrokes.
# Documented fix: a longer escape-time (microsoft/terminal#16384). 50ms is
# imperceptible for Esc in Claude Code. If it still leaks, try 100.
# Applies live to the running server (input parsing, not attach negotiation).
set -s escape-time 50
